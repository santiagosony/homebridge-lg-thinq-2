# Opens pull requests to keep dependencies and GitHub Actions up to date.
# Security updates are opened as soon as an advisory is published, independently of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # ts-jest and typescript-eslint do not support TypeScript 7 yet (peer ranges <7 and <6.1).
      # Remove this rule once they do.
      - dependency-name: typescript
        versions: ['>=7']
      # Node.js type definitions follow the oldest supported Node.js major (22, see engines in
      # package.json), so code cannot use APIs that Node.js 22 does not have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # Build and test tools in one pull request; they are not part of the published package.
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    labels: [dependencies]
