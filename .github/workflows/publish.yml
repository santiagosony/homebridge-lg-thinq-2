name: Publish to npm

# Publishes the package to npm when a new version reaches main, then creates the
# vX.Y.Z tag and a GitHub release whose notes come from that version's section in
# CHANGELOG.md (a heading that starts with "## vX.Y.Z"). If the current version is
# already on npm but has no GitHub release yet, the release is created on the next
# push, tagging the commit that set that version in package.json.
# A version is published only if the "version" in package.json is not on npm yet,
# so pushes that do not change the version just run the checks.
#
# Running the workflow by hand (Actions > Publish to npm > Run workflow) with a
# version creates the missing GitHub release for a version that is already on npm.
#
# Authentication: npm trusted publishing (OIDC). This repository and this workflow
# file (publish.yml) are registered as the trusted publisher of the package on
# npmjs.com, so no npm token is needed. Do not rename this file without updating
# the trusted publisher settings on npmjs.com.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Create the GitHub release for this already published version (for example 2.0.1). Leave empty for a normal run.'
        required: false
        default: ''
      release_target:
        description: 'Commit to tag, only needed if the vX.Y.Z tag does not exist yet.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag and the GitHub release
      id-token: write # required for npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, to find the commit that set a version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (trusted publishing needs npm 11.5.1 or later)
        run: npm install -g npm@11

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --silent
        env:
          CI: true

      - name: Check whether this version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm. Bump the version in package.json to publish a new release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is not on npm yet and will be published."
          fi

      - name: Publish to npm
        id: publish
        if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist_tag }}"

      - name: Create GitHub release
        if: steps.publish.outcome == 'success' || steps.version.outputs.published == 'true' || inputs.release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          JUST_PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          INPUT_VERSION: ${{ inputs.release_version }}
          INPUT_TARGET: ${{ inputs.release_target }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${{ steps.version.outputs.version }}"
          fi
          TAG="v$VERSION"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # npm can take a few minutes to list a version it just accepted, so only
          # check versions that were not published by this run.
          if [[ "$JUST_PUBLISHED" != "true" ]] && ! npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is not on npm, so no release is created for it."
            exit 1
          fi

          # Pick the commit for the tag: an existing tag is reused as it is.
          TARGET_ARGS=()
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            if [[ -n "$INPUT_TARGET" ]]; then
              TARGET="$INPUT_TARGET"
            elif [[ "$JUST_PUBLISHED" == "true" ]]; then
              TARGET="$GITHUB_SHA"
            elif [[ -z "$INPUT_VERSION" ]]; then
              # Already published earlier from main: tag the commit that set this version.
              TARGET=$(git log -n 1 --format=%H -G "\"version\": \"$VERSION\"" -- package.json)
            fi
            if [[ -z "${TARGET:-}" ]]; then
              echo "::error::Tag $TAG does not exist. Run the workflow again with release_target set to the commit that was published."
              exit 1
            fi
            echo "Tagging $TAG at $TARGET."
            TARGET_ARGS=(--target "$TARGET")
          fi

          # Release notes: the CHANGELOG section of this version, up to the next "## " heading.
          awk -v v="$VERSION" '
            BEGIN { found = 0 }
            /^## / {
              if (found) exit
              if (index($0, "## v" v) == 1) { rest = substr($0, length("## v" v) + 1); if (rest == "" || rest ~ /^[ (]/) { found = 1; next } }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG section found for $TAG." > release-notes.md
          fi
          {
            echo ""
            echo "npm: https://www.npmjs.com/package/$NAME/v/$VERSION"
            echo ""
            echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md"
          } >> release-notes.md

          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          gh release create "$TAG" "${TARGET_ARGS[@]}" "${PRERELEASE_ARGS[@]}" --title "$TAG" --notes-file release-notes.md
          echo "Created release $TAG."
