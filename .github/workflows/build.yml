name: CI - Build, Lint, Test

on:
  push:
  pull_request:

# Read-only token: this workflow only checks the code.
permissions:
  contents: read

# A newer push to the same pull request cancels the checks of the previous one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them up to date.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # --ignore-scripts: dependencies cannot run install scripts in CI.
      - name: Install dependencies (npm ci)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Test
        run: npm test --silent
        env:
          CI: true
